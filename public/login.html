<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanPro - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #121212;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-login {
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
    }
    .form-control {
      background-color: #121212;
      border: 1px solid #2d2d2d;
      color: #fff;
    }
    .form-control:focus {
      background-color: #121212;
      color: #fff;
      border-color: #fff;
      box-shadow: none;
    }
    .btn-green {
      background-color: #2ecc71;
      color: #000;
      font-weight: 700;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div class="card-login">
  <h3 class="fw-bold mb-1 text-center">LoanPro</h3>
  <p class="text-secondary text-center small mb-4">Microfinance Dashboard Sign In</p>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label text-secondary small">Username</label>
      <input type="text" id="username" class="form-control" required placeholder="Enter username">
    </div>
    <div class="mb-4">
      <label class="form-label text-secondary small">Password</label>
      <input type="password" id="password" class="form-control" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-green py-2">Sign In</button>
  </form>
</div>

<script>
  // Clear expired/bad tokens when visiting login page
  localStorage.removeItem('token');

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usernameInput, password: passwordInput })
      });

      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('token', data.token);
        window.location.href = '/index.html';
      } else {
        alert(data.error || 'Login failed');
      }
    } catch (err) {
      alert('Server connection error');
    }
  });
</script>

</body>
</html>
