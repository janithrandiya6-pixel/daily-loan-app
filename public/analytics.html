<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanPro - Analytics & Expenses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { background-color: #1a1a1a !important; border-right: 1px solid #333; min-height: 100vh; }
    .card { background-color: #1e1e1e; border: 1px solid #333; }
    .table { color: #e0e0e0; }
    .modal-content { background-color: #1e1e1e; color: #e0e0e0; border: 1px solid #444; }
    .nav-link.active { background-color: #2c2c2c; color: #fff !important; border-radius: 5px; }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar py-4 px-3">
        <h3 class="text-white fw-bold mb-4">LoanPro</h3>
        <ul class="nav flex-column gap-2">
          <li class="nav-item"><a href="index.html" class="nav-link text-secondary">📊 Dashboard</a></li>
          <li class="nav-item"><a href="analytics.html" class="nav-link text-white active">📈 Analytics & Expenses</a></li>
        </ul>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
          <h1 class="h2">Financial Analytics & Expenses</h1>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#expenseModal">+ Add New Expense</button>
        </div>

        <!-- Chart Section -->
        <div class="row mb-4">
          <div class="col-md-8">
            <div class="card p-4">
              <h5 class="mb-3">Financial Overview Chart</h5>
              <div style="position: relative; height:300px; width:100%">
                <canvas id="analyticsChart"></canvas>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-4 h-100">
              <h5 class="mb-3">Daily Collection Sheet</h5>
              <div class="mb-2">
                <input type="date" id="collectionDateInput" class="form-control bg-dark text-white border-secondary" onchange="loadDailyCollection()">
              </div>
              <h4 id="todayTotalVal" class="text-success mb-3">රු. 0.00</h4>
              <div style="max-height: 180px; overflow-y: auto;" id="dailyCollectionList">
                <small class="text-muted">No collections for this date.</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Expenses Table -->
        <div class="card p-4">
          <h5 class="mb-3">Expenses Record</h5>
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Title</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="expensesTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Expense Modal -->
  <div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content p-3">
        <div class="modal-header border-bottom border-secondary">
          <h5 class="modal-title">Add New Expense</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="expenseForm">
            <div class="mb-3">
              <label class="form-label">Expense Title</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" id="expTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Amount (Rs.)</label>
              <input type="number" class="form-control bg-dark text-white border-secondary" id="expAmount" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control bg-dark text-white border-secondary" id="expDate">
            </div>
            <button type="submit" class="btn btn-success w-100">Save Expense</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let myChart = null;

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('collectionDateInput').value = new Date().toISOString().split('T')[0];
      document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
      
      loadAnalyticsData();
      loadExpenses();
      loadDailyCollection();

      document.getElementById('expenseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          title: document.getElementById('expTitle').value,
          amount: document.getElementById('expAmount').value,
          expense_date: document.getElementById('expDate').value
        };
        
        const res = await fetch('/api/expenses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (res.ok) {
          const modalEl = document.getElementById('expenseModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          modal.hide();
          
          document.getElementById('expenseForm').reset();
          document.getElementById('expDate').value = new Date().toISOString().split('T')[0];

          loadExpenses();
          loadAnalyticsData();
        }
      });
    });

    async function loadAnalyticsData() {
      try {
        const res = await fetch('/api/analytics');
        const data = await res.json();

        const ctx = document.getElementById('analyticsChart').getContext('2d');
        if(myChart) myChart.destroy();

        myChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Expected Total', 'Total Collected', 'Total Expenses'],
            datasets: [{
              label: 'Amount in Rs.',
              data: [data.totalExpected, data.totalCollected, data.totalExpenses],
              backgroundColor: ['#0d6efd', '#198754', '#dc3545'],
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } }
          }
        });
      } catch (err) { console.error(err); }
    }

    async function loadExpenses() {
      try {
        const res = await fetch('/api/expenses');
        const expenses = await res.json();
        const tbody = document.getElementById('expensesTableBody');
        tbody.innerHTML = '';
        expenses.forEach((exp, idx) => {
          tbody.innerHTML += `
            <tr>
              <td>${idx + 1}</td>
              <td>${exp.title}</td>
              <td>${exp.expense_date}</td>
              <td>රු. ${parseFloat(exp.amount).toFixed(2)}</td>
              <td><button class="btn btn-sm btn-outline-danger" onclick="deleteExpense(${exp.id})">Delete</button></td>
            </tr>
          `;
        });
      } catch (err) { console.error(err); }
    }

    async function deleteExpense(id) {
      if(confirm("Delete this expense?")) {
        await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
        loadExpenses();
        loadAnalyticsData();
      }
    }

    async function loadDailyCollection() {
      const selectedDate = document.getElementById('collectionDateInput').value;
      try {
        const res = await fetch(`/api/daily-collection?date=${selectedDate}`);
        const data = await res.json();

        document.getElementById('todayTotalVal').innerText = `රු. ${parseFloat(data.totalCollectedToday).toFixed(2)}`;
        const listDiv = document.getElementById('dailyCollectionList');
        listDiv.innerHTML = '';

        if(data.collections.length === 0) {
          listDiv.innerHTML = `<small class="text-muted">No collections found.</small>`;
          return;
        }

        data.collections.forEach(c => {
          listDiv.innerHTML += `
            <div class="p-2 mb-1 bg-black rounded border border-secondary d-flex justify-content-between">
              <span>${c.customer_name} (Day ${c.day_number})</span>
              <strong class="text-success">රු. ${parseFloat(c.amount_paid).toFixed(2)}</strong>
            </div>
          `;
        });
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
